syntax = "proto3";
package com.fraudengine.proto;

option java_package = "com.fraudengine.proto";
option java_outer_classname = "FraudulentTransactionEventProto";

import "google/protobuf/timestamp.proto";

message FraudulentTransactionEvent {
  string transaction_id = 1;
  string customer_id    = 2;
  int32  risk_score     = 3;
  google.protobuf.Timestamp assessed_at = 4;
}
