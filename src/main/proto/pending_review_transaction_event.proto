syntax = "proto3";
package com.fraudengine.proto;

option java_package = "com.fraudengine.proto";
option java_outer_classname = "PendingReviewTransactionEventProto";

import "google/protobuf/timestamp.proto";
import "transaction_event.proto";

message PendingReviewTransactionEvent {
  string transaction_id = 1;
  string customer_id    = 2;
  string merchant_id    = 3;
  string amount         = 4;  // BigDecimal as plain string
  string currency       = 5;
  TransactionType transaction_type    = 6;
  int32  risk_score     = 7;
  google.protobuf.Timestamp assessed_at = 8;
}
