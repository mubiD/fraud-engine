# =============================================================================
# LOCAL PROFILE
# =============================================================================
# Activates with: SPRING_PROFILES_ACTIVE=local (docker-compose.dev.yml / `make dev`)
#
# Real PostgreSQL + real Kafka (see LocalKafkaConfig.java for topic declarations
# and the @Primary JpaTransactionManager), but JSON Kafka serialisation instead
# of Confluent Protobuf + Schema Registry. See pom.xml's `confluent` Maven
# profile comment: the Kafka Protobuf serialiser is an opt-in dependency
# (`mvn package -Pconfluent`) so the default build compiles and runs from Maven
# Central alone. Without this override, the base application.yml's Confluent
# classes fail to load under the default (non -Pconfluent) build.
#
# TransactionConsumer (@Profile("!standalone & !local")) doesn't run under this
# profile anyway; transactions enter via StandaloneTransactionController's
# synchronous HTTP stub instead (see DESIGN.md §3). So these serialiser classes
# only need to be valid and loadable to satisfy Spring Boot's KafkaProperties
# binding at startup, not to actually move real Kafka traffic.
# =============================================================================

spring:
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
