spring:
  application:
    name: fraud-rule-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:frauddb}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
      transaction-id-prefix: fraud-engine-tx-
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: fraud-engine-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
        specific.protobuf.value.type: "com.fraudengine.proto.TransactionEventProto$TransactionEvent"
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
    listener:
      concurrency: 6
      shutdown-timeout: 30000
    # Second, independent consumer group on transactions.raw (see
    # VelocityStreamsTopologyConfig) — materialises "customer-activity-store" for
    # EvaluationContextBuilder to read via Interactive Queries, replacing its live
    # Postgres queries for the rules listed in the implementation plan's Scope section.
    # Only active under !standalone & !local (see VelocityStreamsTopologyConfig's own
    # @Profile — this block being unconditionally present in the base application.yml
    # does not itself start any Kafka Streams machinery under those profiles).
    streams:
      application-id: fraud-engine-velocity-streams
      properties:
        num.stream.threads: 6
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        # Same Confluent Protobuf class the producer/consumer serializers above use,
        # referenced only as a string here too — kept out of the default (non
        # -Pconfluent) build's compile-time dependencies, resolved reflectively at
        # runtime exactly like spring.kafka.producer.value-serializer above.
        default.value.serde: io.confluent.kafka.streams.serdes.protobuf.KafkaProtobufSerde
        specific.protobuf.value.type: "com.fraudengine.proto.TransactionEventProto$TransactionEvent"
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}

  cache:
    type: caffeine

  lifecycle:
    timeout-per-shutdown-phase: 30s

  config:
    import: "optional:vault://"

  cloud:
    vault:
      host: ${VAULT_HOST:vault}
      port: ${VAULT_PORT:8200}
      token: ${VAULT_TOKEN:dev-root-token}
      scheme: http
      kv:
        enabled: true
        backend: secret
        default-context: fraud-engine

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:--}] [txn=%X{transactionId:--}] [%X{kafkaTopic:--}:%X{kafkaOffset:--}] %-40.40logger{39} : %m%n"

fraud:
  security:
    idp-base-uri: ${FRAUD_IDP_URI:https://idp.acmebank.example/oauth2/default}
    allowed-roles:
      - FRAUD_ANALYST
      - FRAUD_ENGINEER
    whitelisted-paths:
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
    protected-paths:
      - /api/v1/**

  schema-registry:
    url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
  kafka:
    replication-factor: 2
    topics:
      transactions-raw: transactions.raw
      transactions-flagged: transactions.flagged
      transactions-pending-review: transactions.pending-review
      transactions-passed: transactions.passed
      transactions-dlt: transactions.raw.DLT

  rules:
    context-lookback-minutes: 60
    amount-threshold:
      enabled: true
      threshold: 5000.00
      category-thresholds:
        RETAIL: 15000.00
        ELECTRONICS: 15000.00
        TRAVEL: 20000.00
        GROCERY: 3000.00
        MONEY_TRANSFER: 2000.00
        WIRE_TRANSFER: 2000.00
    velocity:
      enabled: true
      max-transactions: 5
      window-minutes: 10
    duplicate:
      enabled: true
      card-present-window-seconds: 120
      card-not-present-window-seconds: 300
    geographic:
      enabled: true
      window-minutes: 60
      max-travel-speed-kmh: 900.0
    multi-channel:
      enabled: true
      window-minutes: 5
    device-fingerprint:
      enabled: true
      window-minutes: 60
    card-cloning:
      enabled: true
      window-minutes: 10
      min-different-merchants: 2
    time-of-day:
      enabled: true
      off-hours-start-hour: 23
      off-hours-end-hour: 5
    high-risk-category:
      enabled: true
      high-risk-keywords:
        - CRYPTO
        - CRYPTOCURRENCY
        - CRYPTO_EXCHANGE
        - MONEY_TRANSFER
        - WIRE_TRANSFER
      medium-risk-keywords:
        - GAMBLING
        - CASINO
        - BETTING
        - PAYDAY_LOAN
    cross-merchant-velocity:
      enabled: true
      max-transactions: 10
      window-minutes: 10
    cumulative-spending:
      enabled: true
      hourly-limit: 10000.00
      daily-limit: 25000.00
      hourly-window-minutes: 60
    customer-amount-anomaly:
      enabled: true
      lookback-days: 90
      min-history-count: 5
      stddev-multiplier: 3.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4317}

server:
  port: 8080
  shutdown: graceful

resilience4j:
  ratelimiter:
    instances:
      api:
        limit-for-period: 100
        limit-refresh-period: 10s
        timeout-duration: 0
      standalone-submit:
        limit-for-period: 20
        limit-refresh-period: 10s
        timeout-duration: 0
