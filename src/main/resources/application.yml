spring:
  application:
    name: fraud-rule-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:frauddb}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
      transaction-id-prefix: fraud-engine-tx-
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: fraud-engine-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
        specific.protobuf.value.type: "com.fraudengine.proto.TransactionEventProto$TransactionEvent"
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
    listener:
      shutdown-timeout: 30000

  cache:
    type: caffeine

  config:
    import: "optional:vault://"

  cloud:
    vault:
      host: ${VAULT_HOST:vault}
      port: ${VAULT_PORT:8200}
      token: ${VAULT_TOKEN:dev-root-token}
      scheme: http
      kv:
        enabled: true
        backend: secret
        default-context: fraud-engine

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:--}] [txn=%X{transactionId:--}] [%X{kafkaTopic:--}:%X{kafkaOffset:--}] %-40.40logger{39} : %m%n"

fraud:
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
  kafka:
    replication-factor: 2
    topics:
      transactions-raw: transactions.raw
      transactions-flagged: transactions.flagged
      transactions-passed: transactions.passed
      transactions-dlt: transactions.raw.DLT

  rules:
    context-lookback-minutes: 60
    amount-threshold:
      enabled: true
      threshold: 5000.00
    velocity:
      enabled: true
      max-transactions: 5
      window-minutes: 10
    duplicate:
      enabled: true
      card-present-window-seconds: 30
      card-not-present-window-seconds: 300
    blacklisted-merchant:
      enabled: true
    geographic:
      enabled: true
      window-minutes: 60
      max-travel-speed-kmh: 900.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans

server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
