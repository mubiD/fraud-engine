# Pins the Docker Remote API version docker-java (via Testcontainers 1.19.8) negotiates with.
# Without this, docker-java falls back to its hardcoded default of 1.32, which Docker Engine
# 29+ (Rancher Desktop included) rejects outright ("client version 1.32 is too old. Minimum
# supported API version is 1.41/1.44"). Testcontainers 1.x doesn't auto-negotiate a working
# version the way 2.x does. Any value within the daemon's supported range works; 1.44 is safely
# inside Docker 29's accepted range without being pinned to the exact ceiling.
api.version=1.44
