spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    vault:
      enabled: false
  kafka:
    properties:
      schema.registry.url: mock://fraud-engine-test

fraud:
  kafka:
    replication-factor: 1
  rules:
    amount-threshold:
      threshold: 5000.00
    velocity:
      max-transactions: 5
      window-minutes: 10
    duplicate:
      card-present-window-seconds: 30
      card-not-present-window-seconds: 300
    geographic:
      window-minutes: 60
