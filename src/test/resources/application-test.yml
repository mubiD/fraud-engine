spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    vault:
      enabled: false
  kafka:
    properties:
      schema.registry.url: mock://fraud-engine-test

fraud:
  kafka:
    replication-factor: 1
  rules:
    amount-threshold:
      threshold: 5000.00
      category-thresholds:
        RETAIL: 15000.00
        ELECTRONICS: 15000.00
        TRAVEL: 20000.00
        GROCERY: 3000.00
        MONEY_TRANSFER: 2000.00
        WIRE_TRANSFER: 2000.00
    velocity:
      max-transactions: 5
      window-minutes: 10
    duplicate:
      card-present-window-seconds: 120
      card-not-present-window-seconds: 300
    geographic:
      window-minutes: 60
    multi-channel:
      window-minutes: 5
    device-fingerprint:
      window-minutes: 60
    card-cloning:
      window-minutes: 10
      min-different-merchants: 2
    time-of-day:
      off-hours-start-hour: 23
      off-hours-end-hour: 5
    high-risk-category:
      high-risk-keywords:
        - CRYPTO
        - CRYPTOCURRENCY
        - CRYPTO_EXCHANGE
        - MONEY_TRANSFER
        - WIRE_TRANSFER
      medium-risk-keywords:
        - GAMBLING
        - CASINO
        - BETTING
        - PAYDAY_LOAN
    cross-merchant-velocity:
      max-transactions: 10
      window-minutes: 10
    cumulative-spending:
      hourly-limit: 10000.00
      daily-limit: 25000.00
      hourly-window-minutes: 60
