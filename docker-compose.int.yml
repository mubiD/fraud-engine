version: "3.9"

# INT environment — port range 8082 / 5434 / 9292
# docker compose -f docker-compose.yml -f docker-compose.int.yml up -d

services:
  postgres:
    container_name: fraud-postgres-int
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_int:/var/lib/postgresql/data

  kafka1:
    container_name: fraud-kafka1-int
    ports:
      - "9292:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9292,INTERNAL://kafka1:29092

  kafka2:
    container_name: fraud-kafka2-int
    ports:
      - "9293:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9293,INTERNAL://kafka2:29093

  kafka3:
    container_name: fraud-kafka3-int
    ports:
      - "9294:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9294,INTERNAL://kafka3:29094

  fraud-engine:
    container_name: fraud-engine-int
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: int

volumes:
  postgres_data_int:
