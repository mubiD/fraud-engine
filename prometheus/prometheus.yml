global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fraud-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fraud-engine:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: fraud-engine
