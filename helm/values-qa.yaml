##################################################################################
# fraud-rule-engine — qa
# NOTE: <ECR_ACCOUNT_ID>, <AWS_REGION>, and vault paths are placeholder values.
#       Replace with actual coordinates before deploying to a real cluster.
##################################################################################
active: true

#---------------------------------------------
# Scaling
#---------------------------------------------
replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 256Mi

#---------------------------------------------
# Environment options
#---------------------------------------------
env:
  - name: SPRING_PROFILES_ACTIVE
    value: qa
  - name: HOST_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
    value: "http://$(HOST_IP):4317"

nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
      - matchExpressions:
          - key: sdlc
            operator: In
            values:
              - qa

#---------------------------------------------
# Vault - Operator
#---------------------------------------------
vault:
  paths:
    - name: shared
      path: fraud-engine/shared/qa
      rolloutTargetsEnabled: false
    - name: service
      path: fraud-engine/service/qa
      rolloutTargetsEnabled: false
  baseMountPath: /vault/secrets
  refreshAfter: 60s

#---------------------------------------------
# Ingress
#---------------------------------------------
ingress:
  enabled: true
  className: ''
  annotations: {}
  hostname: fraud-rule-engine-qa.ingress
  host: fraud-rule-engine-qa.ingress
  commonName: fraud-rule-engine-qa.ingress
  hosts:
    - host: fraud-rule-engine-qa.ingress
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - fraud-rule-engine-qa.ingress
      secretName: fraud-rule-engine-qa.ingress

#---------------------------------------------
# Service Account
#---------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: 'fraud-rule-engine-qa-sa'

##################################################################################
#  !! Odin Managed. Be careful if you modify !!
##################################################################################

#---------------------------------------------
# Deployment Image
#---------------------------------------------
image:
  repository: <ECR_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/fraud-rule-engine
  tag: qa-1.0.0-00000000
