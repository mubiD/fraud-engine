##################################################################################
# fraud-rule-engine — dev
# NOTE: <ECR_ACCOUNT_ID>, <AWS_REGION>, and vault paths are placeholder values.
#       Replace with actual coordinates before deploying to a real cluster.
##################################################################################
active: true

#---------------------------------------------
# Scaling
#---------------------------------------------
replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

#---------------------------------------------
# Environment options
#---------------------------------------------
env:
  - name: SPRING_PROFILES_ACTIVE
    value: dev
  # Instana agent runs as a DaemonSet; HOST_IP resolves to the current node's IP at runtime.
  # The agent listens on port 4317 for OTLP gRPC spans.
  - name: HOST_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
    value: "http://$(HOST_IP):4317"

nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
      - matchExpressions:
          - key: sdlc
            operator: In
            values:
              - dev_int

#---------------------------------------------
# Vault - Operator
#---------------------------------------------
vault:
  paths:
    - name: shared
      # PLACEHOLDER — replace with actual shared secrets path
      path: fraud-engine/shared/dev
      rolloutTargetsEnabled: false
    - name: service
      # PLACEHOLDER — replace with actual service secrets path
      path: fraud-engine/service/dev
      rolloutTargetsEnabled: false
  baseMountPath: /vault/secrets
  refreshAfter: 60s

#---------------------------------------------
# Ingress
#---------------------------------------------
ingress:
  enabled: true
  className: ''
  annotations: {}
  hostname: fraud-rule-engine-dev.ingress
  host: fraud-rule-engine-dev.ingress
  commonName: fraud-rule-engine-dev.ingress
  hosts:
    - host: fraud-rule-engine-dev.ingress
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - fraud-rule-engine-dev.ingress
      secretName: fraud-rule-engine-dev.ingress

#---------------------------------------------
# Service Account
#---------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: 'fraud-rule-engine-dev-sa'

##################################################################################
#  !! Odin Managed. Be careful if you modify !!
##################################################################################

#---------------------------------------------
# Deployment Image
#---------------------------------------------
image:
  # PLACEHOLDER — replace <ECR_ACCOUNT_ID> and <AWS_REGION> with real values
  repository: <ECR_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/fraud-rule-engine
  tag: dev-1.0.0-00000000
