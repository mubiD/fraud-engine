version: "3.9"

# Minimal base — sufficient for make dev (single Kafka broker, single Postgres, no Vault,
# no Schema Registry). docker-compose.prod.yml adds the full production stack on top.
# Never run this file directly; use the deploy script or:
#   docker compose -f docker-compose.yml -f docker-compose.<env>.yml up -d

# Extension fields for Kafka broker common configuration (shared across kafka1/kafka2/kafka3)
x-kafka-broker-common:
  &kafka-broker-common
  image: confluentinc/cp-kafka:7.6.1
  environment:
    KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  healthcheck:
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 30s

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d frauddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka1:
    <<: *kafka-broker-common
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka1:29092
      # Single-node KRaft: quorum of one. docker-compose.prod.yml overrides this to 3 voters.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      # RF=1 and min_ISR=1 for single-broker dev. docker-compose.prod.yml raises these.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka1:29092 --list"]

  fraud-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      secrets:
        - maven_settings
        - corp_ca
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: frauddb
      DB_USER: fraud
      DB_PASSWORD: fraud
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092
      # MANAGEMENT_OTLP_TRACING_ENDPOINT intentionally absent: no tracing backend in dev.
    depends_on:
      postgres:
        condition: service_healthy
      kafka1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

# Build-time only (see docker/Dockerfile). Defaults are committed empty files, i.e. resolve
# straight from Maven Central + Confluent with the system trust store. scripts/deploy.sh
# defaults MAVEN_SETTINGS_FILE to ~/.m2/settings.xml when present; set CORP_CA_FILE to your
# proxy's root CA (PEM) if your network does TLS inspection.
secrets:
  maven_settings:
    file: ${MAVEN_SETTINGS_FILE:-../settings-local.xml}
  corp_ca:
    file: ${CORP_CA_FILE:-./corp-ca.none.pem}

volumes:
  postgres_data:
  prometheus_data:
