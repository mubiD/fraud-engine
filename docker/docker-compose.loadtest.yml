# Load-test overlay: adds InfluxDB + Grafana to the running dev stack.
# Usage: make load-test [scenario=01] [vus=10] [duration=2m]
# Requires: make dev must already be running.

services:
  influxdb:
    image: influxdb:1.8
    # influxdb:1.8 has no ARM64 image; platform forces Rosetta emulation on Apple Silicon.
    platform: linux/amd64
    container_name: fraud-influxdb
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports:
      - "8086:8086"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: fraud-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../load-tests/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../load-tests/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb
