# Load-test overlay: adds Grafana to the running dev stack for metrics visualization.
# Uses the Prometheus instance already running in docker-compose.yml
# Usage: make load-test [scenario=01] [vus=10] [duration=2m]
# Requires: make dev must already be running.

services:
  grafana:
    image: grafana/grafana:10.4.0
    container_name: fraud-rule-engine-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../load-tests/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../load-tests/grafana/dashboards:/var/lib/grafana/dashboards:ro
