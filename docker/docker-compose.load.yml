version: "3.9"

# LOAD environment — port range 8084 / 5436 / 9492
# docker compose -f docker-compose.yml -f docker-compose.load.yml up -d

services:
  postgres:
    container_name: fraud-postgres-load
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_load:/var/lib/postgresql/data

  kafka1:
    container_name: fraud-kafka1-load
    ports:
      - "9492:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9492,INTERNAL://kafka1:29092

  kafka2:
    container_name: fraud-kafka2-load
    ports:
      - "9493:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9493,INTERNAL://kafka2:29093

  kafka3:
    container_name: fraud-kafka3-load
    ports:
      - "9494:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9494,INTERNAL://kafka3:29094

  fraud-engine:
    container_name: fraud-engine-load
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: load

  influxdb:
    image: influxdb:1.8
    container_name: fraud-influxdb-load
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb_data_load:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.4.2
    container_name: fraud-grafana-load
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../load-tests/grafana/provisioning:/etc/grafana/provisioning
      - ../load-tests/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb

  # k6 is only active under the "k6" profile — it is NOT started by `make load`.
  # Trigger it explicitly with:  make load-test  or  make load-test SCENARIO=02-ramp
  # K6_OUT streams metrics to InfluxDB in real time so Grafana shows live results.
  k6:
    profiles: ["k6"]
    image: grafana/k6:latest
    container_name: fraud-k6-load
    volumes:
      - ../load-tests:/scripts
    environment:
      BASE_URL: http://fraud-engine:8080
      K6_OUT: influxdb=http://influxdb:8086/k6
    depends_on:
      fraud-engine:
        condition: service_healthy
      influxdb:
        condition: service_started

volumes:
  postgres_data_load:
  influxdb_data_load:
