version: "3.9"

# LOAD-TEST environment: port range 8084 / 5436 / 9492
# docker compose -f docker-compose.yml -f docker-compose.load-test.yml up -d
#
# Sole purpose: a real target for k6 load tests (load-tests/), producing real
# Confluent-Protobuf messages to transactions.raw via TransactionConsumer (the
# actual production ingestion path), not the standalone/local HTTP stub.

services:
  postgres:
    container_name: fraud-postgres-load-test
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_load_test:/var/lib/postgresql/data

  kafka1:
    container_name: fraud-kafka1-load-test
    ports:
      - "9492:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9492,INTERNAL://kafka1:29092

  kafka2:
    container_name: fraud-kafka2-load-test
    ports:
      - "9493:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9493,INTERNAL://kafka2:29093

  kafka3:
    container_name: fraud-kafka3-load-test
    ports:
      - "9494:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9494,INTERNAL://kafka3:29094

  # Mock OIDC/JWKS issuer: verification-only. This environment normally validates JWTs
  # against Acme Bank's real IdP (application.yml's FRAUD_IDP_URI default), unreachable
  # outside the corporate network, which fails the app's fail-fast JWT-decoder startup
  # check (SecurityConfig.jwtDecoder, DESIGN.md §11 "Fail-fast startup on IDP
  # unavailability"). This lets load-test boot and be exercised offline. If it's ever run
  # somewhere with real IdP reachability, override FRAUD_IDP_URI back to the real issuer.
  # Testing against a near-zero-latency mock isn't representative of the real IDP's own
  # latency contribution.
  mock-oidc:
    container_name: fraud-mock-oidc-load-test
    image: ghcr.io/navikt/mock-oauth2-server:latest
    environment:
      JSON_CONFIG_PATH: /config.json
    volumes:
      - ./mock-oidc/config.json:/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/default/.well-known/openid-configuration || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  fraud-engine:
    container_name: fraud-engine-load-test
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: load-test
      FRAUD_IDP_URI: http://mock-oidc:8080/default
    depends_on:
      mock-oidc:
        condition: service_healthy

  influxdb:
    image: influxdb:1.8
    container_name: fraud-influxdb-load-test
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb_data_load_test:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.4.2
    container_name: fraud-grafana-load-test
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../load-tests/grafana/provisioning:/etc/grafana/provisioning
      - ../load-tests/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb

  # k6 is only active under the "k6" profile. It is NOT started by `make load-test`.
  # Trigger it explicitly with:  make k6-run  or  make k6-run SCENARIO=02-ramp RATE=500
  # K6_OUT streams metrics to InfluxDB in real time so Grafana shows live results.
  #
  # Uses the xk6-kafka build (github.com/mostafa/xk6-kafka, k6/x/kafka module) instead of
  # stock grafana/k6: scenarios produce real Confluent-Protobuf TransactionEvent messages
  # to transactions.raw, the actual production ingestion path, not the standalone HTTP stub
  # (which isn't even loaded under this profile, see StandaloneTransactionController's
  # @Profile). Protobuf + Schema Registry support has been fully implemented since xk6-kafka v2.1.0.
  k6:
    profiles: ["k6"]
    image: mostafamoradian/xk6-kafka:latest
    container_name: fraud-k6-load-test
    volumes:
      - ../load-tests:/scripts
    environment:
      BASE_URL: http://fraud-engine:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29093,kafka3:29094
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Same mock IdP fraud-engine validates against (see its own comment above). /api/v1/**
      # requires a real Bearer JWT with a FRAUD_ANALYST/FRAUD_ENGINEER role claim
      # (SecurityConfig, application.yml's resource-server.allowed-roles) even for GETs.
      OIDC_TOKEN_URL: http://mock-oidc:8080/default/token
      K6_OUT: influxdb=http://influxdb:8086/k6
    depends_on:
      fraud-engine:
        condition: service_healthy
      influxdb:
        condition: service_started
      schema-registry:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy

volumes:
  postgres_data_load_test:
  influxdb_data_load_test:
