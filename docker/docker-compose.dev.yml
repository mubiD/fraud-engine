version: "3.9"

# DEV overlay: container names, host ports, and local profile activation.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    container_name: fraud-postgres-dev
    ports:
      - "5433:5432"

  kafka1:
    container_name: fraud-kafka1-dev
    ports:
      - "9192:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9192,INTERNAL://kafka1:29092
      # Allow schema-registry to create its internal _schemas topic on fresh deploys
      # (not needed in dev since schema-registry doesn't run, but harmless for local testing)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  fraud-engine:
    container_name: fraud-engine-dev
    mem_limit: 1g
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local

  prometheus:
    container_name: fraud-prometheus-dev
    ports:
      - "9090:9090"
