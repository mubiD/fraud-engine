version: "3.9"

# PROD environment — port range 8085 / 5437 / 9592
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    container_name: fraud-postgres-prod
    ports:
      - "5437:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  kafka1:
    container_name: fraud-kafka1-prod
    ports:
      - "9592:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9592,INTERNAL://kafka1:29092

  kafka2:
    container_name: fraud-kafka2-prod
    ports:
      - "9593:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9593,INTERNAL://kafka2:29093

  kafka3:
    container_name: fraud-kafka3-prod
    ports:
      - "9594:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9594,INTERNAL://kafka3:29094

  fraud-engine:
    container_name: fraud-engine-prod
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

volumes:
  postgres_data_prod:
