version: "3.9"

# PROD environment — port range 8085 / 5437 / 9592-9594
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# First-time startup sequence:
#   1. Generate Kafka certs:  ./scripts/gen-kafka-certs.sh
#   2. Export required secrets (never commit these):
#        export KAFKA_SSL_KEYSTORE_PASSWORD=<ks-password>
#        export KAFKA_SSL_TRUSTSTORE_PASSWORD=<ts-password>
#        export KAFKA_ADMIN_PASSWORD=<broker-admin-password>
#        export KAFKA_CLIENT_PASSWORD=<kafka-client-password>
#   3. docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#      vault-init runs automatically, prints VAULT_ROLE_ID and VAULT_SECRET_ID.
#   4. Export those values and restart the fraud-engine:
#        export VAULT_ROLE_ID=<role-id>
#        export VAULT_SECRET_ID=<secret-id>
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d fraud-engine
#
# Subsequent startups (stack restart): just export all five env vars and run up -d.
# vault-init is idempotent — it re-unseals Vault from the saved key and exits.

services:

  postgres:
    container_name: fraud-postgres-prod
    ports:
      - "5437:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  # ── Kafka brokers ──────────────────────────────────────────────────────────
  # Each broker exposes a SASL_SSL listener on port 9092 (host-mapped to 959x).
  # The INTERNAL (PLAINTEXT) listener is retained for broker-to-broker comms on
  # the private Docker network. CONTROLLER stays PLAINTEXT (KRaft, internal only).

  kafka1:
    container_name: fraud-kafka1-prod
    ports:
      - "9592:9092"
    volumes:
      - ./certs/prod:/etc/kafka/secrets:ro
    environment:
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka1:9092,INTERNAL://kafka1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # TLS — PKCS12 keystore generated by scripts/gen-kafka-certs.sh
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka1.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      # SASL — PLAIN over TLS; user_<name> entries declare valid client identities
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL__SSL_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL__SSL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD}"
        user_fraud-engine="${KAFKA_CLIENT_PASSWORD}";

  kafka2:
    container_name: fraud-kafka2-prod
    ports:
      - "9593:9092"
    volumes:
      - ./certs/prod:/etc/kafka/secrets:ro
    environment:
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:9092,INTERNAL://0.0.0.0:29093,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka2:9092,INTERNAL://kafka2:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka2.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL__SSL_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL__SSL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD}"
        user_fraud-engine="${KAFKA_CLIENT_PASSWORD}";

  kafka3:
    container_name: fraud-kafka3-prod
    ports:
      - "9594:9092"
    volumes:
      - ./certs/prod:/etc/kafka/secrets:ro
    environment:
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:9092,INTERNAL://0.0.0.0:29094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka3:9092,INTERNAL://kafka3:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka3.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL__SSL_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL__SSL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${KAFKA_ADMIN_PASSWORD}"
        user_fraud-engine="${KAFKA_CLIENT_PASSWORD}";

  # ── Vault (server mode) ──────────────────────────────────────────────────────
  # Replaces the base compose dev-mode Vault with a proper server-mode instance.
  # Storage is backed by a named Docker volume — secrets persist across restarts.
  # The vault-init service handles initialisation and unsealing on startup.

  vault:
    container_name: fraud-vault-prod
    # No VAULT_DEV_ROOT_TOKEN_ID — server mode reads config from /vault/config/
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ""
      VAULT_DEV_LISTEN_ADDRESS: ""
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data_prod:/vault/data
    cap_add:
      - IPC_LOCK
    healthcheck:
      # Exit 0 = unsealed, exit 2 = sealed but running — both mean the API is up.
      test: ["CMD-SHELL", "VAULT_ADDR=http://localhost:8200 vault status; ec=$?; [ $ec -eq 0 ] || [ $ec -eq 2 ]"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ── Vault init (one-shot) ────────────────────────────────────────────────────
  # Runs scripts/vault-init.sh inside the Vault image.
  # Initialises on first run; re-unseals on subsequent runs (idempotent).
  # Exits 0 when done — fraud-engine waits for this via service_completed_successfully.

  vault-init:
    image: hashicorp/vault:1.15
    container_name: fraud-vault-init-prod
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./scripts/vault-init.sh:/vault-init.sh:ro
      - vault_init_prod:/vault/init
    environment:
      VAULT_ADDR: http://vault:8200
      DB_PASSWORD: ${DB_PASSWORD:-}
      KAFKA_CLIENT_PASSWORD: ${KAFKA_CLIENT_PASSWORD:-}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:-}
      FRAUD_IDP_URI: ${FRAUD_IDP_URI:-}
    entrypoint: ["sh", "/vault-init.sh"]
    restart: "no"

  # ── Application ──────────────────────────────────────────────────────────────
  # Connects to SASL_SSL Kafka listeners and authenticates with Vault via AppRole
  # (role-id + secret-id) instead of the hardcoded root token used in dev mode.

  fraud-engine:
    container_name: fraud-engine-prod
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "8085:8080"
    volumes:
      - ./certs/prod/kafka.truststore.p12:/etc/ssl/kafka/truststore.p12:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_CLIENT_PASSWORD: ${KAFKA_CLIENT_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      # AppRole credentials output by vault-init on first run (store securely thereafter)
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
      # Clear the dev-mode root token so it cannot be used in prod
      VAULT_TOKEN: ""

volumes:
  postgres_data_prod:
  vault_data_prod:
  vault_init_prod:
