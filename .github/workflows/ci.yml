name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
# Prevents queued runs from piling up on fast-moving branches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: compile + test ────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Amazon Corretto 25 matches the base image used in docker/Dockerfile.
      # `cache: maven` restores ~/.m2 between runs — avoids re-downloading the
      # full dependency tree (~400 MB) on every push.
      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'maven'

      - name: Compile
        run: ./mvnw compile -q

      # Unit tests run without Docker or external services.
      # Excludes the Testcontainers-based integration test class.
      - name: Unit tests
        run: ./mvnw test -Dtest='!**/integration/**' -q

      # Integration tests spin up real Postgres + Kafka via Testcontainers.
      # GitHub's ubuntu-latest runner ships Docker, so no extra service config needed.
      # -Pconfluent is required: TransactionIntegrationTest exercises the Confluent
      # Protobuf wire format; those classes only land on the classpath under that profile.
      - name: Integration tests
        run: ./mvnw test -Dtest='**/integration/**' -Pconfluent

      # Package JAR for Docker build (tests already ran, so -DskipTests)
      # Required by docker/Dockerfile which expects pre-built JAR in target/
      - name: Package JAR
        run: ./mvnw package -DskipTests -Pconfluent -q

      # Upload the Surefire XML reports so GitHub can surface per-test pass/fail
      # detail on the PR checks page, even when the job itself succeeds.
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Docker image build ────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test  # only builds the image if all tests pass

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The JAR is compiled inside the image build (multi-stage docker/Dockerfile), so CI
      # builds the exact artefact that ships, with -Pconfluent, rather than a host-built JAR.
      # Tag with the commit SHA so every image built in CI is traceable to its commit.
      # Optional: a MAVEN_SETTINGS repository secret is passed as a BuildKit secret for
      # networks that need an authenticated Maven mirror; unset, the build resolves publicly.
      - name: Write Maven settings secret
        env:
          MAVEN_SETTINGS: ${{ secrets.MAVEN_SETTINGS }}
        run: |
          if [ -n "$MAVEN_SETTINGS" ]; then
            printf '%s' "$MAVEN_SETTINGS" > "$RUNNER_TEMP/maven-settings.xml"
          else
            cp settings-local.xml "$RUNNER_TEMP/maven-settings.xml"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: |
            fraud-engine:${{ github.sha }}
            fraud-engine:latest
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml
          cache-from: type=gha
          cache-to: type=gha,mode=max
