name: Fraud Rule Engine CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (leave blank to auto-detect from branch)'
        required: false
        type: choice
        options: ['', dev, load-test, prod]
  pull_request:
    branches:
      - dev
      - load-test
      - prod
    types:
      - opened
      - synchronize
      - closed
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pom.xml'
      - '.github/workflows/*.yml'

permissions:
  contents: read
  pull-requests: write

# One run per target branch, never cancel an in-flight deploy
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Which environment to target.
# On a PR event this is the base branch (dev / load-test / prod).
# On workflow_dispatch the input takes precedence, otherwise uses ref_name.
# ---------------------------------------------------------------------------
env:
  TARGET_ENV: >-
    ${{
      github.event_name == 'pull_request' && github.base_ref ||
      github.event.inputs.environment != '' && github.event.inputs.environment ||
      github.ref_name
    }}

jobs:

# ---------------------------------------------------------------------------
# Job 1: Build & Test
# Runs on every PR open/update. Uses a GitHub-hosted runner (no local deps).
# ---------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-22.04
    # Run on open/sync, and also on merge (closed+merged) so the artifact
    # is available to the deploy job in the same run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        (github.event.action == 'closed' && github.event.pull_request.merged == true)))

    outputs:
      POM_VERSION:     ${{ steps.vars.outputs.POM_VERSION }}
      POM_ARTIFACT_ID: ${{ steps.vars.outputs.POM_ARTIFACT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Extract POM coordinates
        id: vars
        run: |
          echo "POM_ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> "$GITHUB_OUTPUT"
          echo "POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"         >> "$GITHUB_OUTPUT"

      - name: Build & unit tests
        run: mvn clean install --batch-mode --errors -T 1C -Pconfluent

      - name: Integration tests (Testcontainers)
        run: mvn test --batch-mode -Dtest="**/integration/**" -Pconfluent

      - name: Build Docker image for scanning
        run: docker build -t fraud-rule-engine:scan .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: fraud-rule-engine:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ env.TARGET_ENV }}
          path: target/${{ steps.vars.outputs.POM_ARTIFACT_ID }}-${{ steps.vars.outputs.POM_VERSION }}.jar
          retention-days: 1

# ---------------------------------------------------------------------------
# Job 2: Deploy
# Runs ONLY on merge (PR closed + merged).
#
# STUB NOTICE: Deployment steps are stubbed for portfolio/showcase purposes.
# No self-hosted runners are registered in this enterprise org, so infrastructure
# steps echo what they would execute rather than running live.
#
# In a real environment this job would run on a self-hosted runner registered
# against the target environment, with Docker and k6 available locally.
# The full implementation is preserved below, only the `run:` bodies are stubbed.
# ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ github.event_name == 'pull_request' && github.base_ref || github.event.inputs.environment || github.ref_name }}
    needs: build
    runs-on: ubuntu-22.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true)

    environment: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.inputs.environment || github.ref_name }}

    env:
      POM_VERSION:     ${{ needs.build.outputs.POM_VERSION }}
      POM_ARTIFACT_ID: ${{ needs.build.outputs.POM_ARTIFACT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ env.TARGET_ENV }}
          path: target/

      # STUB: in a live environment this runs bash scripts/deploy.sh ${{ env.TARGET_ENV }},
      # which tears down the existing containers, rebuilds the image, starts fresh containers,
      # and polls /actuator/health until the app is ready.
      - name: Deploy ${{ env.TARGET_ENV }} [STUB]
        run: |
          echo "[STUB] Would run: bash scripts/deploy.sh ${{ env.TARGET_ENV }}"
          echo "[STUB] Steps: docker compose down → build image → docker compose up → health poll"

      # ---- load-test branch only: run the full k6 suite after deploy ------
      # STUB: in a live environment k6 is installed on the runner and executed against
      # the running app. Thresholds are defined in load-tests/config.js.
      - name: Install k6 [STUB]
        if: env.TARGET_ENV == 'load-test'
        run: echo "[STUB] Would run: brew install k6 (if not already present)"

      - name: k6 baseline [STUB]
        if: env.TARGET_ENV == 'load-test'
        run: echo "[STUB] Would run: k6 run load-tests/scenarios/01-baseline.js (100 VUs, 2 min)"

      - name: k6 ramp [STUB]
        if: env.TARGET_ENV == 'load-test'
        run: echo "[STUB] Would run: k6 run load-tests/scenarios/02-ramp.js (10 → 500 VUs, 5 min)"

      - name: k6 spike [STUB]
        if: env.TARGET_ENV == 'load-test'
        run: echo "[STUB] Would run: k6 run load-tests/scenarios/03-spike.js (50 → 500 → 50 VUs)"

      - name: k6 fraud-rules mix [STUB]
        if: env.TARGET_ENV == 'load-test'
        run: echo "[STUB] Would run: k6 run load-tests/scenarios/04-fraud-rules.js (mixed read/write)"

      # ---- prod: create a GitHub release on merge --------------------------
      - name: Create GitHub Release
        if: env.TARGET_ENV == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${POM_VERSION}-${{ env.TARGET_ENV }}-${GITHUB_SHA::8}"
          gh release create "$TAG" \
            --target ${{ github.base_ref }} \
            --prerelease \
            --generate-notes \
            --title "$POM_ARTIFACT_ID $POM_VERSION (${{ env.TARGET_ENV }})"
