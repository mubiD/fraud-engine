name: Fraud Rule Engine CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (leave blank to auto-detect from branch)'
        required: false
        type: choice
        options: ['', dev, int, qa, load, prod]
  pull_request:
    branches:
      - dev
      - int
      - qa
      - load
      - prod
    types:
      - opened
      - synchronize
      - closed
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pom.xml'
      - '.github/workflows/*.yml'

permissions:
  contents: read
  pull-requests: write

# One run per target branch — never cancel an in-flight deploy
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Which environment to target.
# On a PR event this is the base branch (dev / int / qa / load / prod).
# On workflow_dispatch the input takes precedence, otherwise uses ref_name.
# ---------------------------------------------------------------------------
env:
  TARGET_ENV: >-
    ${{
      github.event_name == 'pull_request' && github.base_ref ||
      github.event.inputs.environment != '' && github.event.inputs.environment ||
      github.ref_name
    }}

jobs:

# ---------------------------------------------------------------------------
# Job 1 — Build & Test
# Runs on every PR open/update. Uses a GitHub-hosted runner (no local deps).
# ---------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-22.04
    # Run on open/sync, and also on merge (closed+merged) so the artifact
    # is available to the deploy job in the same run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        (github.event.action == 'closed' && github.event.pull_request.merged == true)))

    outputs:
      POM_VERSION:     ${{ steps.vars.outputs.POM_VERSION }}
      POM_ARTIFACT_ID: ${{ steps.vars.outputs.POM_ARTIFACT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Extract POM coordinates
        id: vars
        run: |
          echo "POM_ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> "$GITHUB_OUTPUT"
          echo "POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"         >> "$GITHUB_OUTPUT"

      - name: Build & unit tests
        run: mvn clean install --batch-mode --errors -T 1C

      - name: Integration tests (Testcontainers)
        run: mvn test --batch-mode -Dtest="**/integration/**"

      - name: Build Docker image for scanning
        run: docker build -t fraud-rule-engine:scan .

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: fraud-rule-engine:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ env.TARGET_ENV }}
          path: target/${{ steps.vars.outputs.POM_ARTIFACT_ID }}-${{ steps.vars.outputs.POM_VERSION }}.jar
          retention-days: 1

# ---------------------------------------------------------------------------
# Job 2 — Deploy to local container
# Runs ONLY on merge (PR closed + merged).
# Runs on a self-hosted runner — this is your local machine.
#
# Setup (one-time): install the GitHub Actions self-hosted runner on your Mac,
# register it at: github.com/<your-repo>/settings/actions/runners
# The runner label used here is "self-hosted".
#
# What happens: the deploy script tears down the environment's containers,
# rebuilds the image from the checked-out source, and starts fresh containers.
# Postgres data volumes are preserved across deploys.
# ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ github.event_name == 'pull_request' && github.base_ref || github.event.inputs.environment || github.ref_name }}
    needs: build
    runs-on: self-hosted
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true)

    environment: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.inputs.environment || github.ref_name }}

    env:
      POM_VERSION:     ${{ needs.build.outputs.POM_VERSION }}
      POM_ARTIFACT_ID: ${{ needs.build.outputs.POM_ARTIFACT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar-${{ env.TARGET_ENV }}
          path: target/

      - name: Deploy ${{ env.TARGET_ENV }}
        run: bash scripts/deploy.sh ${{ env.TARGET_ENV }}

      # ---- load branch only: run the full k6 suite after deploy -----------
      - name: Install k6
        if: env.TARGET_ENV == 'load'
        run: |
          if ! command -v k6 &>/dev/null; then
            brew install k6
          fi

      - name: k6 — baseline
        if: env.TARGET_ENV == 'load'
        run: k6 run load-tests/scenarios/01-baseline.js
        env:
          BASE_URL: http://localhost:8084

      - name: k6 — ramp
        if: env.TARGET_ENV == 'load'
        run: k6 run load-tests/scenarios/02-ramp.js
        env:
          BASE_URL: http://localhost:8084

      - name: k6 — spike
        if: env.TARGET_ENV == 'load'
        run: k6 run load-tests/scenarios/03-spike.js
        env:
          BASE_URL: http://localhost:8084

      - name: k6 — fraud-rules mix
        if: env.TARGET_ENV == 'load'
        run: k6 run load-tests/scenarios/04-fraud-rules.js
        env:
          BASE_URL: http://localhost:8084

      # ---- qa / prod: create a GitHub release on merge --------------------
      - name: Create GitHub Release
        if: env.TARGET_ENV == 'qa' || env.TARGET_ENV == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${POM_VERSION}-${{ env.TARGET_ENV }}-${GITHUB_SHA::8}"
          gh release create "$TAG" \
            --target ${{ github.base_ref }} \
            --prerelease \
            --generate-notes \
            --title "$POM_ARTIFACT_ID $POM_VERSION (${{ env.TARGET_ENV }})"
